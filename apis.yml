name: Web Methods
description: Web Methods (webMethods) is an enterprise integration platform pioneer, founded in 1996 by Phillip
  and Caren Merrick in Fairfax, Virginia to connect software applications in real time using web standards such
  as HTTP and XML. Its 2000 IPO was one of the largest first-day pops of the dot-com era. webMethods was acquired
  by Software AG in 2007 for $546 million, and its integration portfolio - now including webMethods.io Integration
  (iPaaS), API Gateway and API Management, the Developer Portal, B2B/EDI, messaging, managed file transfer, and
  event-driven integration - was acquired by IBM in July 2024 as IBM webMethods Hybrid Integration. Mayfield was
  an early venture backer of the company.
